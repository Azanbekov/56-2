{% extends 'base.html' %}
{% load static %}

{% block content %}
<form method="get" action="" enctype="multipart/form-data">
    {{ form.as_p }}
    <button type="submit">Search</button>
</form>
{% for post in posts_list %}
<div class="card" style="width: 18rem; margin-top: 18px;">
    {% if post.image %}
  <img class="card-img-top" src="{{post.image.url}}" alt="Card image cap">
  {% else %}
    <img class="card-img-top" src="{% static 'Placeholder_view_vector.svg.png' %}" alt="Card image cap">
  {% endif %}
  <div class="card-body">
    <h5 class="card-title">{{ post.title }}</h5>
    <p class="card-text">{{ post.content }}</p>
    <p class="card-text">{{ post.rate }}</p>
     <p class="card-text">{{ post.created_at }}</p>
    <a href="/posts/{{post.id}}/" class="btn btn-primary">Go to post</a>
  </div>
</div>
{% endfor %}
  <div style="display: flex; justify-content: center; margin-top: 20px; margin-bottom: 20px;"
    {% for 1 in max_pages %}
        <a href="/posts/?page={{i}}" class="btn btn-primary" >{{ i }}</a>
    {% endfor %}
  </div>

{% endblock %}
